  <circle cx="170" cy="155" r="4" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="270" cy="115" r="4" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Support Vector / Borderline Points (Amber) -->
  <circle cx="245" cy="185" r="5.5" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="258" cy="172" r="5" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>

