  <rect x="470" y="102" width="175" height="56" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="482" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">
