<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" height="100%" fill="none">
  <!-- Card Background -->
  <rect width="680" height="380" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Subtle Header Bar inside graphic -->
  <rect x="0" y="0" width="680" height="42" rx="14" fill="#F8FAFC"/>
