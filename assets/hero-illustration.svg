  <line x1="213" y1="65" x2="213" y2="305" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="287" y1="65" x2="287" y2="305" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
