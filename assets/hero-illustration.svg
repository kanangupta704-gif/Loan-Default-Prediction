  </text>
  <text x="15" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B" transform="rotate(-90 15 195)">
    Debt-to-Income (DTI: 50% → 10%)
  </text>

  <!-- Plot Ticks -->
  <text x="65" y="318" font-family="monospace" font-size="9" fill="#94A3B8">580</text>
  <text x="139" y="318" font-family="monospace" font-size="9" fill="#94A3B8">640</text>
  <text x="213" y="318" font-family="monospace" font-size="9" fill="#94A3B8">700</text>
  <text x="287" y="318" font-family="monospace" font-size="9" fill="#94A3B8">760</text>
  <text x="361" y="318" font-family="monospace" font-size="9" fill="#94A3B8">820</text>

  <text x="45" y="260" font-family="monospace" font-size="9" fill="#94A3B8">15%</text>
  <text x="45" y="212" font-family="monospace" font-size="9" fill="#94A3B8">25%</text>
  <text x="45" y="164" font-family="monospace" font-size="9" fill="#94A3B8">35%</text>
  <text x="45" y="116" font-family="monospace" font-size="9" fill="#94A3B8">45%</text>

