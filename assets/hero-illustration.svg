  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <text x="85" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569">
