  <!-- Decision Region Shading: High Risk (top left) -->
  <path d="M 65 65 L 435 65 L 435 95 Q 320 130 250 180 T 65 240 Z" fill="#FEF2F2" opacity="0.6"/>

  <!-- Decision Boundary Curve -->
  <path d="M 65 240 Q 180 230 250 180 T 435 95" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="none" fill="none"/>
  
  <!-- Applicant Data Points: Non-Default (Forest Green) -->
  <circle cx="310" cy="270" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="340" cy="245" r="4" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="380" cy="260" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="410" cy="230" r="4" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="370" cy="180" r="4" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="395" cy="140" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="280" cy="250" r="4" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="260" cy="285" r="4" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="330" cy="205" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="295" cy="225" r="4" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="220" cy="280" r="4" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>

