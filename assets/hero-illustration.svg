  <circle cx="245" cy="185" r="10" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <rect x="235" y="140" width="110" height="26" rx="4" fill="#0F172A"/>
  <text x="242" y="157" font-family="monospace" font-size="10" font-weight="600" fill="#FFFFFF">Score: P(Def)=0.24</text>
  <polygon points="255,166 261,166 245,178" fill="#0F172A"/>

  <!-- Plot Axes Labels -->
  <text x="210" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">
