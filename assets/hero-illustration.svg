  <!-- Bottom Legend Bar -->
  <line x1="65" y1="345" x2="615" y2="345" stroke="#F1F5F9"/>
  <circle cx="85" cy="358" r="4" fill="#16A34A"/>
  <text x="96" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">
