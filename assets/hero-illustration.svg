  <line x1="475" y1="358" x2="495" y2="358" stroke="#3B82F6" stroke-width="2"/>
  <text x="502" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">
